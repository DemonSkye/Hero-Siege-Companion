<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Npcap installer options for Hero Siege Companion</title>
  <desc id="desc">Npcap setup screen showing that administrator-only access should be unchecked and WinPcap API-compatible mode should be checked.</desc>
  <rect width="760" height="560" fill="#f3f3f3"/>
  <rect x="1" y="1" width="758" height="558" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="1" y="1" width="758" height="44" fill="#ffffff"/>
  <circle cx="22" cy="23" r="11" fill="#e6f4f1" stroke="#4e9a8e"/>
  <text x="42" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#222">Npcap 1.71 Setup</text>
  <text x="694" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#333">-</text>
  <rect x="722" y="13" width="13" height="13" fill="none" stroke="#777"/>
  <text x="742" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#333">x</text>
  <rect x="1" y="45" width="758" height="82" fill="#ffffff" stroke="#d4d4d4"/>
  <rect x="1" y="45" width="230" height="82" fill="#240753"/>
  <path d="M92 73 C119 50 151 54 179 82 C150 112 119 113 92 86 Z" fill="#cbefff" stroke="#8dd6ef" stroke-width="3"/>
  <circle cx="136" cy="82" r="22" fill="#86c7d9" opacity=".9"/>
  <circle cx="136" cy="82" r="8" fill="#3e6370"/>
  <text x="69" y="113" font-family="Georgia, serif" font-size="18" fill="#88e7ff">NMAP.ORG</text>
  <text x="246" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111">Installation Options</text>
  <text x="246" y="99" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#111">Please review the following options before installing Npcap.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#111">
    <rect x="58" y="225" width="18" height="18" fill="#fff" stroke="#222"/>
    <text x="87" y="240">Restrict Npcap driver's access to Administrators only</text>
    <rect x="42" y="211" width="438" height="46" rx="7" fill="none" stroke="#e11d1d" stroke-width="6"/>
    <rect x="58" y="269" width="18" height="18" fill="#fff" stroke="#222"/>
    <text x="87" y="284">Support raw 802.11 traffic and monitor mode for wireless adapters</text>
    <rect x="58" y="313" width="18" height="18" fill="#fff" stroke="#222"/>
    <path d="M62 321 L67 326 L74 316" fill="none" stroke="#111" stroke-width="2"/>
    <text x="87" y="328">Install Npcap in WinPcap API-compatible Mode</text>
    <rect x="42" y="299" width="388" height="46" rx="7" fill="none" stroke="#e11d1d" stroke-width="6"/>
  </g>
  <text x="14" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9a9a9a">Nullsoft Install System</text>
  <line x1="18" y1="500" x2="742" y2="500" stroke="#bdbdbd"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <rect x="382" y="520" width="110" height="32" fill="#f7f7f7" stroke="#999"/>
    <text x="418" y="541" fill="#111">&lt; Back</text>
    <rect x="500" y="520" width="110" height="32" fill="#f7f7f7" stroke="#0078d4" stroke-width="2"/>
    <text x="535" y="541" fill="#111">Install</text>
    <rect x="626" y="520" width="110" height="32" fill="#f7f7f7" stroke="#999"/>
    <text x="663" y="541" fill="#111">Cancel</text>
  </g>
</svg>
